<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexa - New Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contact-container">

        <!-- Header -->
        <header class="contact-header">

            <button class="contact-back"
                    onclick="window.location.href='new-chat.html'">
                ←
            </button>

            <h1>New contact</h1>

        </header>


        <!-- Contact Form -->
        <main class="contact-form">

            <!-- First Name -->
            <div class="contact-field">


                <input
                    type="text"
                    placeholder="First name"
                >

            </div>


            <!-- Last Name -->
            <div class="contact-field">

                <input
                    type="text"
                    placeholder="Last name"
                >

            </div>


            <!-- Username -->
            <div class="contact-field">


                <input
                    type="text"
                    placeholder="Username"
                >

            </div>


            <!-- Phone -->
            <div class="phone-row">

                <div class="country-field">

                    <label>Country</label>

                    <button class="country-select">
                        JO +962
                        <span>⌄</span>
                    </button>

                </div>


                <div class="phone-field">

                    <label>Phone</label>

                    <input type="text">

                </div>

            </div>

        </main>

    </div>

</body>

</html>
