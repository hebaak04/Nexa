<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa - Status</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="status-container">

  <h1 class="status-logo">
    <span>N</span>exa
</h1>


    <!-- My Status -->
    <div class="my-status">
        <div class="status-avatar">
            +
        </div>

        <div class="status-info">
            <h3>My status</h3>
            <p>Tap to add status update</p>
        </div>
    </div>


    <!-- Recent Updates -->
    <div class="status-section">
        <p class="section-title">Recent updates</p>

        <div class="status-empty">
            <div class="empty-status-icon">
                ◯
            </div>

            <h2>No status updates</h2>

            <p>
                Status updates from your contacts<br>
                will appear here.
            </p>
        </div>
    </div>


    <!-- Bottom Navigation -->
    <div class="bottom-nav">

        <button class="nav-item" onclick="location.href='home.html'">
            <span class="nav-icon">▰</span>
            <span>Chats</span>
        </button>

        <button class="nav-item" onclick="window.location.href='calls.html'">
    <span class="nav-icon">☎</span>
    <span>Calls</span>
</button>

        <button class="nav-item active">
            <span class="nav-icon">◉</span>
            <span>Status</span>
        </button>

        <button class="nav-item" onclick="window.location.href='settings.html'">
    <span class="nav-icon">⚙</span>
    <span>Settings</span>
</button>

    </div>

</div>

</body>
</html>
