<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings - Nexa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="settings-container">

        <!-- Header -->
        <div class="settings-header">

            <button class="settings-back"
                    onclick="history.back()">
                ←
            </button>

            <h1>Settings</h1>

            <div class="settings-header-space"></div>

        </div>


        <!-- Settings List -->
        <div class="settings-list">

            <button class="settings-item" onclick="window.location.href='help.html'">

    <span class="settings-name">
        Help
    </span>

    <span class="settings-arrow">
        ›
    </span>

</button>


            <button
    class="settings-item"
    onclick="window.location.href='profile.html'">

    <span class="settings-name">
        Profile
    </span>

    <span class="settings-arrow">
        ›
    </span>

</button>


           <button
    class="settings-item"
    onclick="window.location.href='account.html'">

    <span class="settings-name">
        Account
    </span>

    <span class="settings-arrow">
        ›
    </span>

</button>

 <button
    class="settings-item"
    onclick="window.location.href='chat-settings.html'">

    <span class="settings-name">
                    Chat settings
    </span>

    <span class="settings-arrow">
        ›
    </span>

</button>
<button
    class="settings-item"
    onclick="window.location.href='notifications.html'">

    <span class="settings-name">
        Notifications
    </span>

    <span class="settings-arrow">
        ›
    </span>

</button>

        </div>


        <!-- Footer -->
        <div class="settings-footer">

            <div>N E X A</div>

            <p>
                P E O P L E &nbsp; • &nbsp; P R I V A C Y &nbsp; • &nbsp; S A F E T Y
            </p>

        </div>


        <!-- Bottom Navigation -->
       <nav class="settings-bottom-nav">

    <button class="settings-nav-item active"
            onclick="window.location.href='home.html'">
        <span class="nav-icon">▰</span>
        <small>Chats</small>
    </button>

    <button
    class="settings-nav-item"
    onclick="window.location.href='calls.html'">

    <span class="nav-icon">☎</span>

    <small>Calls</small>

</button>

    <button class="settings-nav-item"
        onclick="window.location.href='status.html'">

    <span class="nav-icon">◉</span>
    <small>Status</small>

</button>

    <button class="settings-nav-item"
            onclick="window.location.href='settings.html'">
        <span class="nav-icon">⚙</span>
        <small>Settings</small>
    </button>

</nav>

    </div>
<script>
function selectSetting(item) {

    document.querySelectorAll(".settings-item").forEach(function(element) {
        element.classList.remove("selected");
    });

    item.classList.add("selected");
}
</script>

</body>
</html>
