<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account - Nexa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="account-container">

        <!-- Header -->

        <header class="account-header">

            <button
                class="account-back"
                onclick="window.location.href='settings.html'">
                ←
            </button>

            <h1>Account</h1>

        </header>


        <!-- Account Options -->

        <main class="account-options">


            <!-- Phone Number -->

            <button
                class="account-item"
                onclick="window.location.href='phone-number.html'">

                <span class="account-icon">
                    ☎
                </span>

                <span class="account-info">

                    <span class="account-title">
                        Phone number
                    </span>

                    <span class="account-description">
                        +962 7 9123 4567
                    </span>

                </span>

                <span class="account-arrow">
                    ›
                </span>

            </button>


            <!-- Change Password -->

            <button
                class="account-item"
                onclick="window.location.href='change-password.html'">

                <span class="account-icon">
                    🔒
                </span>

                <span class="account-info">

                    <span class="account-title">
                        Change password
                    </span>

                    <span class="account-description">
                        Update your password
                    </span>

                </span>

                <span class="account-arrow">
                    ›
                </span>

            </button>


            <!-- Two-Step Verification -->

            <button
                class="account-item"
                onclick="window.location.href='two-step-verification.html'">

                <span class="account-icon">
                    🛡
                </span>

                <span class="account-info">

                    <span class="account-title">
                        Two-step verification
                    </span>

                    <span class="account-description">
                        Add an extra layer of security
                    </span>

                </span>

                <span class="account-arrow">
                    ›
                </span>

            </button>


            <!-- Delete Account -->

            <button
                class="account-item delete-account-item"
                onclick="window.location.href='delete-account.html'">

                <span class="account-icon delete-icon">
                    🗑
                </span>

                <span class="account-info">

                    <span class="account-title">
                        Delete account
                    </span>

                    <span class="account-description">
                        Permanently delete your account
                    </span>

                </span>

                <span class="account-arrow">
                    ›
                </span>

            </button>


        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
