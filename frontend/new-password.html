<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexa - New Password</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="new-password-container">

        <!-- Back Button -->
        <a href="forgot-verify.html" class="back-button">←</a>

        <!-- Icon -->
        

        <!-- Title -->
        <h1>Create a new password</h1>

        <p class="new-password-subtitle">
            Enter a new password for your Nexa account.
        </p>

        <!-- New Password -->
        <div class="account-input">


            <input
                type="password"
                id="new-password"
                placeholder="New password"
            >

            <button
                type="button"
                class="password-toggle"
                onclick="toggleAccountPassword('new-password')">
                ◉
            </button>

        </div>

        <!-- Confirm Password -->
        <div class="account-input">


            <input
                type="password"
                id="confirm-new-password"
                placeholder="Confirm new password"
            >

            <button
                type="button"
                class="password-toggle"
                onclick="toggleAccountPassword('confirm-new-password')">
                ◉
            </button>

        </div>

        <!-- Save -->
        <button
            class="create-button"
            onclick="saveNewPassword()">

            <span>Save password</span>

            <span>→</span>

        </button>

        <!-- Footer -->
        <div class="account-footer">

            <div>N E X A</div>

            <p>
                P E O P L E&nbsp;&nbsp;•&nbsp;&nbsp;
                P R I V A C Y&nbsp;&nbsp;•&nbsp;&nbsp;
                S A F E T Y
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
