<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - Nexa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="change-password-container">

        <!-- Header -->

        <header class="change-password-header">

            <button
                class="change-password-back"
                onclick="window.location.href='account.html'">
                ←
            </button>

            <h1>Change password</h1>

        </header>


        <!-- Content -->

        <main class="change-password-content">

            <p class="change-password-description">
                Enter your current password and choose a new password.
            </p>


            <!-- Current Password -->

            <div class="password-field">

                <label for="currentPassword">
                    Current password
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    placeholder="Enter current password">

            </div>


            <!-- New Password -->

            <div class="password-field">

                <label for="newPassword">
                    New password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password">

            </div>


            <!-- Confirm Password -->

            <div class="password-field">

                <label for="confirmPassword">
                    Confirm new password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter new password again">

            </div>


            <!-- Save -->

            <button
                class="change-password-save"
                onclick="changePassword()">

                Save Changes

            </button>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
