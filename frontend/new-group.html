<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexa - Add Group Members</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="group-container">

        <!-- Header -->
        <header class="group-header">

            <button class="group-back"
                    onclick="window.location.href='new-chat.html'">
                ←
            </button>

            <h1>Add group members</h1>

        </header>


        <!-- Search -->
        <div class="group-search">

            <span>⌕</span>

            <input
                type="text"
                placeholder="Search name, number or @username"
            >

        </div>


        <!-- Members will appear here later -->
        <main class="group-members">

        </main>

    </div>

</body>

</html>
