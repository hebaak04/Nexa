<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Help - Nexa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="help-container">

        <!-- Header -->
        <header class="help-header">

            <button
                class="help-back"
                onclick="window.location.href='settings.html'">
                ←
            </button>

            <h1>Help</h1>

        </header>


        <!-- Introduction -->
        <section class="help-intro">

            <h2>How can we help you?</h2>

            <p>
                Find answers, get support, and learn how
                Nexa keeps you safe.
            </p>

        </section>


        <!-- Help Options -->
        <main class="help-options">
<button
    class="help-option"
    onclick="window.location.href='faq.html'">

    <div class="help-icon">?</div>

    <div class="help-text">
        <strong>FAQ</strong>
        <small>Find answers to common questions</small>
    </div>

    <span class="help-arrow">›</span>

</button>

           

<button
    class="help-option"
    onclick="window.location.href='report-problem.html'">

    <div class="help-icon">!</div>

    <div class="help-text">
        <strong>Report a problem</strong>
        <small>Let us know if something isn't working</small>
    </div>

    <span class="help-arrow">›</span>

</button>


<button
    class="help-option"
    onclick="window.location.href='terms.html'">

                <div class="help-icon">📄</div>

                <div class="help-text">
                    <strong> Terms of Service and Privacy Policy</strong>
                </div>

                <span class="help-arrow">›</span>

            </button>


<button
    class="help-option"
    onclick="window.location.href='safety-tips.html'">
                <div class="help-icon">♧</div>

                <div class="help-text">
                    <strong>Safety tips</strong>
                    <small>Get tips for a safer online experience</small>
                </div>

                <span class="help-arrow">›</span>

            </button>


<button
    class="help-option"
    onclick="window.location.href='contact-support.html'">
                <div class="help-icon">✉</div>

                <div class="help-text">
                    <strong>Contact support</strong>
                    <small>Reach out to our support team</small>
                </div>

                <span class="help-arrow">›</span>

            </button>

        </main>


        <!-- Safety Message -->
        <div class="help-message">

            <strong>You're not alone.</strong>

            <p>
                We're here to help make your online
                experience safer.
            </p>

        </div>


        <!-- Nexa Footer -->
        <div class="help-footer">

            <strong>N E X A</strong>

            <small>
                P E O P L E • P R I V A C Y • S A F E T Y
            </small>

        </div>

    </div>


</body>

</html>
